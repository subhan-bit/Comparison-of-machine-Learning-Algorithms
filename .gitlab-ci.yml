stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  script:
    - python3 --version
    - cd product
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements-dev.txt
    - pytest --cov=ml_comparison --cov-report=term-missing
  coverage: '/^TOTAL.+?(\d+%)$/'
