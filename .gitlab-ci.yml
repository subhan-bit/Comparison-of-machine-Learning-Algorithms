stages:
  - build
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

default:
  image: python:3.12  # a fixed Python (3.12 or newer is required), not whatever the runner has
  before_script:
    - python3 --version
    - cd product
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements-dev.txt

build:
  stage: build
  script:
    - pip install -e .
    - python -c "import ml_comparison"

lint:
  stage: lint
  script:
    - ruff check src tests scripts

test:
  stage: test
  script:
    - pytest --cov=ml_comparison --cov-branch --cov-report=term-missing --cov-fail-under=95
  coverage: '/^TOTAL.+?(\d+%)$/'
