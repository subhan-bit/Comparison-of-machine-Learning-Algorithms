[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-comparison"
version = "0.1.0"
description = "From-scratch k-NN, decision tree and SVM comparison"
requires-python = ">=3.11"
dependencies = ["numpy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
